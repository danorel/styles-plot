[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "styles-plot"
version = "0.1.11"
description = "One figure grammar shared across research projects: colour by role, marks that carry meaning, keys built from what was drawn, and checks that refuse a figure that breaks the rules."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=8",
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Matplotlib",
]

[project.optional-dependencies]
check = ["colorspacious>=1.1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "colorspacious>=1.1.2"]

[project.scripts]
styles-plot = "styles_plot._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["styles_plot"]

[tool.hatch.build.targets.sdist]
include = ["styles_plot", "docs", "tests", "examples", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:styles_plot.*"]

[tool.coverage.run]
source = ["styles_plot"]

[tool.ruff]
line-length = 120
