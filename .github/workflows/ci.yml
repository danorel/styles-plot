name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        numpy: ["1.26.*", "2.*"]
        matplotlib: ["3.8.*", "latest"]
        exclude:
          # no wheels for these combinations
          - python: "3.13"
            numpy: "1.26.*"
          - python: "3.13"
            matplotlib: "3.8.*"
          # matplotlib releases after numpy 2 require it; 3.8 predates it
          - numpy: "1.26.*"
            matplotlib: "latest"
    name: py${{ matrix.python }} numpy ${{ matrix.numpy }} mpl ${{ matrix.matplotlib }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          uv venv --clear
          mpl="matplotlib==${{ matrix.matplotlib }}"
          [ "${{ matrix.matplotlib }}" = "latest" ] && mpl="matplotlib"
          uv pip install "numpy==${{ matrix.numpy }}" "$mpl" -e ".[dev]"
      - name: test
        run: uv run --no-sync pytest -q --cov=styles_plot/_checks --cov-fail-under=85

  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --clear && uv pip install -e ".[dev]"
      - name: build the gallery (strict)
        run: uv run --no-sync python examples/build_gallery.py --out gallery
      - name: check it
        run: |
          for t in post slide readme; do
            uv run --no-sync styles-plot check gallery/$t --vocab examples/plotstyle.toml
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: gallery/
      - name: the README's generated blocks are up to date
        run: |
          uv run --no-sync python docs/readme_blocks.py
          git diff --exit-code README.md
      - name: the README's images mean what they meant, and its links resolve
        run: uv run --no-sync python docs/readme_blocks.py --check
      - name: the README's images pass check
        run: uv run --no-sync styles-plot check examples/figures --vocab examples/plotstyle.toml

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: build the wheel
        run: uv build --wheel -o dist
      - name: init and a first figure from the installed wheel, in an empty folder
        run: |
          uv venv --clear /tmp/clean
          uv pip install -p /tmp/clean/bin/python dist/*.whl
          mkdir /tmp/first && cd /tmp/first
          /tmp/clean/bin/styles-plot init
          /tmp/clean/bin/python first_figure.py
          /tmp/clean/bin/styles-plot check figures/post --vocab plotstyle.toml
